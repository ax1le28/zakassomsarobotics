<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">Assistive Vision Glasses — system architecture</title>
<desc id="d">ESP32-S3 captures camera frames and ultrasonic distance and posts them to a FastAPI backend. The backend runs YOLO11n detection, fuses distance estimates, scores left, center and right risk, then drives speech output and left/right buzzers.</desc>
<defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8733F"/><stop offset=".5" stop-color="#E3A15E"/><stop offset="1" stop-color="#F1DEC0"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#F1DEC0" opacity=".06"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E7681"/></marker>
<style>
.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.card{fill:#161B22;stroke:#30363D;stroke-width:1.2}
.lbl{font-size:12px;letter-spacing:2px;fill:#6E7681}
.ttl{font-size:17px;font-weight:700;fill:#F0F6FC}
.txt{font-size:13px;fill:#9DA7B3}
.wire{stroke:#30363D;stroke-width:2;fill:none}
.p1{animation:mv 2.2s linear infinite}
.p2{animation:mv 2.2s linear infinite 1.1s}
@keyframes mv{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(66px);opacity:0}}
.d1{animation:dn 1.8s linear infinite}
.d2{animation:dn 1.8s linear infinite .9s}
@keyframes dn{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.live{animation:lv 1.6s ease-in-out infinite}
@keyframes lv{50%{opacity:.25}}
</style>
</defs>
<rect width="1200" height="440" rx="20" fill="#0D1117"/>
<rect width="1200" height="440" rx="20" fill="url(#dots)"/>
<rect x="0" y="0" width="1200" height="3" fill="url(#a)"/>
<!-- stage labels -->
<text x="40" y="48" class="m lbl">01 · EDGE</text>
<text x="408" y="48" class="m lbl">02 · BACKEND</text>
<text x="900" y="48" class="m lbl">03 · FEEDBACK</text>
<circle cx="1150" cy="44" r="5" fill="#A3B18A" class="live"/>
<text x="1138" y="48" class="m" font-size="12" fill="#C2CDA8" text-anchor="end">MVP</text>
<!-- EDGE -->
<rect x="40" y="66" width="290" height="270" rx="14" fill="none" stroke="#B8733F" stroke-opacity=".35" stroke-dasharray="4 5"/>
<text x="60" y="96" class="s ttl">ESP32-S3</text>
<text x="60" y="116" class="m txt" font-size="12">thin client · PlatformIO</text>
<rect x="58" y="134" width="254" height="78" rx="10" class="card"/>
<g transform="translate(76 152)">
<rect width="40" height="30" rx="6" fill="none" stroke="#D08A54" stroke-width="2"/>
<circle cx="20" cy="15" r="8" fill="none" stroke="#D08A54" stroke-width="2"/>
<circle cx="20" cy="15" r="3" fill="#D08A54"/>
</g>
<text x="132" y="166" class="s" font-size="15" font-weight="600" fill="#E6EDF3">Camera frames</text>
<text x="132" y="186" class="m txt" font-size="12">captured on device</text>
<rect x="58" y="226" width="254" height="78" rx="10" class="card"/>
<g transform="translate(74 250) scale(.78)" fill="none" stroke="#D08A54" stroke-width="2.5">
<circle cx="10" cy="15" r="9"/><circle cx="32" cy="15" r="9"/>
<path d="M44 6 q8 9 0 18 M49 1 q13 14 0 28" stroke-opacity=".6"/>
</g>
<text x="132" y="258" class="s" font-size="15" font-weight="600" fill="#E6EDF3">HC-SR04 ultrasonic</text>
<text x="132" y="278" class="m txt" font-size="12">range up to 4.5 m</text>
<!-- wire 1 -->
<path d="M330 200 H404" class="wire" marker-end="url(#ah)"/>
<g fill="#D08A54"><rect x="334" y="196" width="10" height="8" rx="2" class="p1"/><rect x="334" y="196" width="10" height="8" rx="2" class="p2"/></g>
<text x="367" y="186" class="m" font-size="11" fill="#6E7681" text-anchor="middle">POST</text>
<text x="367" y="222" class="m" font-size="11" fill="#6E7681" text-anchor="middle">/analyze</text>
<!-- BACKEND -->
<rect x="408" y="66" width="420" height="270" rx="14" fill="none" stroke="#E3A15E" stroke-opacity=".35" stroke-dasharray="4 5"/>
<text x="428" y="96" class="s ttl">FastAPI · Python</text>
<text x="428" y="116" class="m txt" font-size="12">all inference runs on the laptop</text>
<rect x="426" y="134" width="384" height="52" rx="10" class="card"/>
<rect x="426" y="134" width="4" height="52" rx="2" fill="#B8733F"/>
<text x="446" y="157" class="s" font-size="15" font-weight="600" fill="#E6EDF3">Object detection</text>
<text x="446" y="175" class="m txt" font-size="12">YOLO11n · home &amp; office fine-tuning</text>
<g fill="#E3A15E"><circle cx="618" cy="190" r="2.5" class="d1"/><circle cx="618" cy="190" r="2.5" class="d2"/></g>
<rect x="426" y="210" width="384" height="52" rx="10" class="card"/>
<rect x="426" y="210" width="4" height="52" rx="2" fill="#E3A15E"/>
<text x="446" y="233" class="s" font-size="15" font-weight="600" fill="#E6EDF3">Distance fusion</text>
<text x="446" y="251" class="m txt" font-size="12">bbox geometry + ultrasonic · smoothed</text>
<g fill="#F1DEC0"><circle cx="618" cy="266" r="2.5" class="d1"/><circle cx="618" cy="266" r="2.5" class="d2"/></g>
<rect x="426" y="286" width="384" height="40" rx="10" class="card"/>
<rect x="426" y="286" width="4" height="40" rx="2" fill="#F1DEC0"/>
<text x="446" y="311" class="s" font-size="15" font-weight="600" fill="#E6EDF3">Navigation</text>
<g transform="translate(640 297)" class="m" font-size="11">
<rect width="44" height="18" rx="4" fill="#F1DEC0" fill-opacity=".18" stroke="#F1DEC0" stroke-opacity=".5"/><text x="22" y="13" fill="#F6E8D2" text-anchor="middle">L</text>
<rect x="52" width="44" height="18" rx="4" fill="#E3A15E" fill-opacity=".18" stroke="#E3A15E" stroke-opacity=".5"/><text x="74" y="13" fill="#EDBE85" text-anchor="middle">C</text>
<rect x="104" width="44" height="18" rx="4" fill="#B8733F" fill-opacity=".18" stroke="#B8733F" stroke-opacity=".5"/><text x="126" y="13" fill="#D08A54" text-anchor="middle">R</text>
</g>
<!-- wire 2 -->
<path d="M828 200 H896" class="wire" marker-end="url(#ah)"/>
<g fill="#F1DEC0"><rect x="832" y="196" width="10" height="8" rx="2" class="p1"/><rect x="832" y="196" width="10" height="8" rx="2" class="p2"/></g>
<text x="862" y="186" class="m" font-size="11" fill="#6E7681" text-anchor="middle">cmd</text>
<!-- FEEDBACK -->
<rect x="900" y="66" width="260" height="270" rx="14" fill="none" stroke="#F1DEC0" stroke-opacity=".35" stroke-dasharray="4 5"/>
<text x="920" y="96" class="s ttl">To the user</text>
<text x="920" y="116" class="m txt" font-size="12">voice + buzzer cues</text>
<rect x="918" y="134" width="224" height="78" rx="10" class="card"/>
<g transform="translate(934 156)" fill="none" stroke="#F6E8D2" stroke-width="2" stroke-linecap="round">
<path d="M0 10 h8 l10 -8 v30 l-10 -8 h-8 z" fill="#F6E8D2" fill-opacity=".15"/>
<path d="M24 8 q6 8 0 16 M29 3 q11 13 0 26" stroke-opacity=".6"/>
</g>
<text x="980" y="166" class="s" font-size="15" font-weight="600" fill="#E6EDF3">Speech</text>
<text x="980" y="186" class="m txt" font-size="11.5">ElevenLabs / macOS say</text>
<rect x="918" y="226" width="224" height="78" rx="10" class="card"/>
<g transform="translate(934 250)" class="m" font-size="10">
<circle cx="8" cy="10" r="8" fill="#F1DEC0" fill-opacity=".25" stroke="#F1DEC0"/>
<circle cx="30" cy="10" r="8" fill="#B8733F" fill-opacity=".25" stroke="#B8733F"/>
</g>
<text x="980" y="258" class="s" font-size="15" font-weight="600" fill="#E6EDF3">L / R buzzers</text>
<text x="980" y="278" class="m txt" font-size="11.5">5 cue patterns</text>
<!-- footer strip -->
<rect x="40" y="360" width="1120" height="52" rx="12" fill="#161B22" stroke="#21262D"/>
<g class="m" font-size="13" fill="#9DA7B3">
<text x="64" y="391"><tspan fill="#D08A54">◆</tspan>  stairs → dedicated stop cue</text>
<text x="352" y="391"><tspan fill="#EDBE85">◆</tspan>  anti-flicker command stability</text>
<text x="664" y="391"><tspan fill="#F6E8D2">◆</tspan>  speech throttling</text>
<text x="870" y="391"><tspan fill="#C2CDA8">◆</tspan>  CI builds 2 firmware targets</text>
</g>
</svg>
